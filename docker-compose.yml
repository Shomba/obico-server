x-web-defaults: &web-defaults
  restart: unless-stopped
  build:
    context: backend
    dockerfile: 'Dockerfile'
  volumes:
    - ./backend:/app
    - ./frontend:/frontend
    - obico_static:/app/static_build
    - obico_data:/data
  depends_on:
    - redis
    - postgres
  environment:
    OCTOPRINT_TUNNEL_PORT_RANGE: '0-0'
    DEBUG: 'False'
    DJANGO_SECRET_KEY: '${DJANGO_SECRET_KEY}'
    DATABASE_URL: 'postgres://obico:${POSTGRES_PASSWORD}@postgres:5432/obico'
    # Alternativa SQLite (1 impressora, uso leve) — comente a linha acima e use:
    # DATABASE_URL: 'sqlite:////data/db.sqlite3'
    REDIS_URL: 'redis://redis:6379'
    INTERNAL_MEDIA_HOST: 'http://web:3334'
    ML_API_HOST: 'http://ml_api:3333'
    SITE_USES_HTTPS: 'False'
    SITE_IS_PUBLIC: 'False'
    ACCOUNT_ALLOW_SIGN_UP: '${ACCOUNT_ALLOW_SIGN_UP-True}'
    WEBPACK_LOADER_ENABLED: 'False'
    DEFAULT_FROM_EMAIL: 'obico@odilonsantos.com'
    EMAIL_HOST: '${EMAIL_HOST-}'
    EMAIL_HOST_USER: '${EMAIL_HOST_USER-}'
    EMAIL_HOST_PASSWORD: '${EMAIL_HOST_PASSWORD-}'
    EMAIL_PORT: '${EMAIL_PORT-587}'
    EMAIL_USE_TLS: '${EMAIL_USE_TLS-True}'
    SOCIAL_LOGIN: 'False'
    VERSION: 'selfhosted'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: obico
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: obico
    volumes:
      - obico_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obico"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - obico_redis:/data

  ml_api:
    hostname: ml_api
    restart: unless-stopped
    build:
      context: ml_api
    environment:
      DEBUG: 'False'
      FLASK_APP: 'server.py'
    tty: true
    command: bash -c "gunicorn --bind 0.0.0.0:3333 --workers 1 wsgi"

  web:
    <<: *web-defaults
    hostname: web
    ports:
      - "3334:3334"
    depends_on:
      - ml_api
      - postgres
      - redis
    command: sh -c 'python manage.py migrate && python manage.py collectstatic -v 0 --noinput && daphne -b 0.0.0.0 -p 3334 config.routing:application'

  tasks:
    <<: *web-defaults
    hostname: tasks
    command: sh -c "celery -A config worker --beat -l info -c 2 -Q realtime,celery"

volumes:
  obico_pgdata:
  obico_redis:
  obico_static:
  obico_data:
